source: https://fhir.fhirpoint.open.allscripts.com/fhirroute/fhir/CP00101/.well-known/smart-configuration
docs: https://developer.veradigm.com/Fhir/ProcessOverview
description: OAuth 2.0 / SMART App Launch scopes advertised by the Veradigm (formerly Allscripts) FHIR
  authorization server. Read verbatim from the scopes_supported array of the live SMART configuration
  document served on the published Veradigm EHR R4 sandbox base URL, and cross-checked against the identical
  scopes_supported array in the OpenID Connect discovery document on the issuer. Nothing here is inferred
  - the descriptions restate the SMART App Launch v1/v2 semantics of the scope strings the server itself
  publishes. Veradigm's Process Overview page states that a registered FHIR application may use SMART
  v1 (.read) scopes or SMART v2 (.rs) scopes but never both; an application requesting both is not approved.
schemes:
- name: SMART on FHIR (OAuth 2.0 + OpenID Connect)
  source: well-known/allscripts-healthcare-solutions-smart-configuration.json
  flows:
  - flow: authorizationCode
    authorizationUrl: https://fhir.fhirpoint.open.allscripts.com/fhirroute/authorizationV2/CP00101/connect/authorize
    tokenUrl: https://fhir.fhirpoint.open.allscripts.com/fhirroute/authorizationV2/CP00101/connect/token
    pkce: S256
  - flow: clientCredentials
    tokenUrl: https://fhir.fhirpoint.open.allscripts.com/fhirroute/authorizationV2/CP00101/connect/token
    note: SMART Backend Services. Only FHIR applications registered with App Type "System" may use client_credentials;
      the developer registers a JWKS URL and the server authenticates a private_key_jwt assertion against
      it.
  issuer: https://fhirecho.fhirpoint.open.allscripts.com/pro/authorization
  jwks_uri: https://fhirecho.fhirpoint.open.allscripts.com/pro/authorization/.well-known/openid-configuration/jwks

caveats:
- Every tool inherits the redaction semantics in conventions/ - a returned element marked "redacted" is not a null.
- 'create_* tools are not retry-safe: no idempotency key is documented and no resource declares a delete interaction.'
- Provenance supports read but NOT search - search_provenance is derived from the CapabilityStatement declaring
  search-type, but the docs state searching Provenance is not supported. Treat that tool as unusable until the contract
  and the docs agree.

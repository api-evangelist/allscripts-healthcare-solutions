- aid: allscripts-healthcare-solutions:veradigm-unity-api
  name: Veradigm Unity API
  description: >-
    Veradigm's proprietary bidirectional API and the only Veradigm surface that can WRITE patient
    demographic, appointment or financial data - the Process Overview page states plainly that the FHIR API
    is read-only for deeper integration purposes and that Unity is required to read or write against
    Veradigm Practice Management. Unity is also the recommended app-launch path for Veradigm EHR versions
    before 24.5. No public reference, base URL, OpenAPI or sandbox is published: access requires a paid
    Veradigm Connect Integrator subscription (Bronze through Platinum Plus) and Veradigm certification. No
    base URL is recorded here because Veradigm publishes none.
  humanURL: https://developer.veradigm.com/Home/LearnMore

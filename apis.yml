description: >-
  Allscripts Healthcare Solutions renamed itself Veradigm in 2022 and sold its hospital and
  large-physician-practice business (Sunrise, Paragon, TouchWorks) to Harris Computer, which now trades as
  Altera Digital Health. allscripts.com redirects to veradigm.com, and the developer program is now the
  Veradigm Connect Developer Program at developer.veradigm.com. Two API estates exist. The first is a
  public, standards-based HL7 FHIR R4 (4.0.1) surface serving USCDI data for 21st Century Cures Act patient
  and provider access - a live sandbox CapabilityStatement declares 31 FHIR resources, twelve of which
  accept create and update and none of which accept delete, authorized with SMART App Launch 2.0.0 over
  OAuth 2.0 and OpenID Connect, with FHIR Bulk Data $export available to backend System applications. Base
  URLs are per customer organization and are published in the Veradigm Endpoint Directory, downloadable as
  an NDJSON FHIR Bundle. The second is the proprietary bidirectional Unity API, the only surface that can
  write patient demographic, appointment or financial data; it is undocumented publicly and requires a paid
  Veradigm Connect Integrator subscription. No OpenAPI, no MCP server, no agent card and no public client
  SDK are published on either estate.

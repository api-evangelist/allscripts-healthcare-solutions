apis:
- aid: allscripts-healthcare-solutions:allscripts-healthcare-solutions-api
  name: Veradigm FHIR R4 API (formerly Allscripts)
  description: >-
    HL7 FHIR R4 (4.0.1) REST API for Veradigm EHR, aligned to USCDI for 21st Century Cures Act patient and
    provider access. The live CapabilityStatement declares 31 resource types (Patient, Encounter,
    Observation, Condition, MedicationRequest, DiagnosticReport, DocumentReference, CarePlan, CareTeam,
    Coverage and more), read and search on all of them, create and update on twelve, and delete on none.
    Authorization is SMART App Launch 2.0.0 over OAuth 2.0 / OpenID Connect, with 237 published scopes
    across patient, user and system contexts. FHIR Bulk Data $export is available to System applications.
    Production base URLs are per customer organization and come from the Veradigm Endpoint Directory; the
    baseURL recorded here is Veradigm's own published sandbox base, which answered an unauthenticated
    GET /metadata with HTTP 200 on 2026-09-01.
  humanURL: https://developer.veradigm.com/Fhir/Introduction
  baseURL: https://fhir.fhirpoint.open.allscripts.com/fhirroute/fhir/CP00101/
